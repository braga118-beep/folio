<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Your document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="public">
  <div class="preview-banner" id="pvBanner" hidden>Preview as your customer. Opening this page yourself doesn't count as a customer view.</div>
  <header class="pub-bar">
    <div class="pub-co" id="pubCo"></div>
    <button class="btn" id="dl" hidden>Download PDF</button>
  </header>
  <main class="pub-wrap">
    <div id="paper"><p class="pub-loading">Loading</p></div>
    <section id="accept" class="accept" hidden></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="render.js"></script>
  <script src="data.js"></script>
  <script>
  (async function () {
    const D = window.Doc;
    const params = new URLSearchParams(location.search);
    const tok = params.get('t');
    const preview = params.get('preview') === '1';
    const paperEl = document.getElementById('paper');
    const box = document.getElementById('accept');
    const fail = (title, msg) => { paperEl.innerHTML = `<div class="pub-msg"><h1>${title}</h1><p>${msg}</p></div>`; };
    document.getElementById('pvBanner').hidden = !preview;

    if (!tok) return fail('Link incomplete', 'This link is missing part of its address. Ask the sender to send it again.');
    let data;
    try {
      await window.Store.init();
      data = await window.Store.getPublic(tok, !preview);
    } catch (e) {
      return fail('Document unavailable', 'This document could not be loaded. Check your connection and try again.');
    }
    if (!data || !data.document) return fail('Link no longer active', 'This document was removed or replaced. Ask the sender for an updated copy.');

    let doc = data.document;
    const company = data.company || {};
    const typeName = doc.type === 'invoice' ? 'Invoice' : 'Estimate';

    function drawAccept() {
      if (doc.type !== 'estimate') { box.hidden = true; return; }
      if (doc.status === 'accepted' || doc.status === 'converted') {
        box.hidden = false;
        box.innerHTML = `<p class="ok">You accepted this estimate${doc.accepted_by ? ' as ' + D.esc(doc.accepted_by) : ''}${doc.accepted_at ? ' on ' + D.fmtDate(doc.accepted_at) : ''}. ${D.esc(company.name)} has been notified.</p>`;
        return;
      }
      if (doc.status !== 'sent' && !(preview && doc.status === 'draft')) { box.hidden = true; return; }
      box.hidden = false;
      if (doc.due_date && doc.due_date < D.today()) {
        box.innerHTML = `<p>This estimate expired on ${D.fmtDate(doc.due_date)}. Contact ${D.esc(company.name)} for an updated estimate.</p>`;
        return;
      }
      box.innerHTML = `
        <h2>Ready to go ahead?</h2>
        <p class="sub">Type your full name to accept this estimate. ${D.esc(company.name)} is notified right away.</p>
        <form id="acf" class="acf"><input name="n" required placeholder="Your full name" autocomplete="name" aria-label="Your full name"><button class="btn primary" type="submit">Accept estimate</button></form>`;
      document.getElementById('acf').onsubmit = async (e) => {
        e.preventDefault();
        const name = e.target.n.value.trim();
        if (!name) return;
        if (preview) { alert('This is a preview, so the estimate was not accepted.'); return; }
        const b = e.target.querySelector('button');
        b.disabled = true;
        try {
          const ok = await window.Store.accept(tok, name);
          if (ok === false) throw new Error('not accepted');
          doc = { ...doc, status: 'accepted', accepted_by: name, accepted_at: new Date().toISOString() };
          draw();
        } catch (err) {
          b.disabled = false;
          alert(`The estimate could not be accepted online. Please contact ${company.name} directly.`);
        }
      };
    }

    function draw() {
      document.title = `${typeName} ${doc.number} from ${company.name || ''}`;
      document.getElementById('pubCo').textContent = company.name || '';
      paperEl.innerHTML = D.renderPaper(doc, company);
      drawAccept();
    }
    draw();

    const dl = document.getElementById('dl');
    dl.hidden = false;
    dl.onclick = async () => {
      dl.disabled = true; dl.textContent = 'Preparing PDF';
      try { (await D.toPdf(D.renderPaper(doc, company))).save(`${typeName} ${doc.number}.pdf`); }
      catch (e) { alert(e.message); }
      dl.disabled = false; dl.textContent = 'Download PDF';
    };
  })();
  </script>
</body>
</html>
