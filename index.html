<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio | Estimates and invoices</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F4E46'/><rect x='18' y='18' width='14' height='14' fill='%239C7434'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="auth" class="auth" hidden></div>

  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><span class="mark" aria-hidden="true"></span>Folio</div>
      <label class="switch" hidden>Company
        <select id="companySwitch"></select>
      </label>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-nav="dashboard">Overview</a>
        <a href="#/jobs" data-nav="jobs">Jobs</a>
        <a href="#/estimates" data-nav="estimates">Estimates</a>
        <a href="#/change_orders" data-nav="change_orders">Change orders</a>
        <a href="#/invoices" data-nav="invoices">Invoices</a>
        <a href="#/customers" data-nav="customers">Customers</a>
        <a href="#/pricebook" data-nav="pricebook">Price book</a>
        <a href="#/companies" data-nav="companies">Companies</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="btn primary" id="newBtn">New</button>
        <button class="bell" id="bell" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge" hidden></span>
        </button>
      </header>
      <div id="banner" class="banner" hidden></div>
      <main id="view" class="sheet"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <datalist id="unitList"><option value="each"><option value="hour"><option value="day"><option value="sq ft"><option value="linear ft"><option value="sq yd"><option value="cu yd"><option value="lot"><option value="job"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="config.js"></script>
  <script src="render.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
